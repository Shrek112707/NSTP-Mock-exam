<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constitution Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .question-box { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; }
        .question { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .options { list-style-type: none; padding: 0; }
        .options li { margin-bottom: 8px; }
        label { cursor: pointer; display: block; }
        button { padding: 12px 20px; border: 1px solid #000; background: #fff; cursor: pointer; font-size: 16px; margin-right: 10px; }
        .feedback { font-weight: bold; margin-left: 10px; font-size: 18px; }
        #result { margin-top: 20px; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Quiz</h1>
    <div id="quiz-container"></div>
    <button onclick="submitQuiz()">Submit Answers</button>
    <button id="reveal-btn" onclick="revealAnswers()" style="display:none;">Reveal Answers</button>
    <div id="result"></div>
</div>

<script>
    function getQuestionData(qNum) {
        if (qNum === 1) { return { q: "What does Service-Learning combine experiential learning with?", options: ["Community service", "Academic writing", "Physical education", "Financial literacy"], a: 0 }; }
        else if (qNum === 2) { return { q: "In Service Learning, students provide service through knowledge, skills, and what?", options: ["Money", "Values", "Equipment", "Time"], a: 1 }; }
        else if (qNum === 3) { return { q: "How does the community give experience to students?", options: ["By paying them", "By giving them grades", "By enhancing knowledge and developing values", "By offering them jobs"], a: 2 }; }
        else if (qNum === 4) { return { q: "What is the body of rules and principles where sovereignty is regularly exercised?", options: ["Ordinance", "Statutory Law", "Bill of Rights", "Constitution"], a: 3 }; }
        else if (qNum === 5) { return { q: "What refers to supreme power or authority?", options: ["Sovereignty", "Patrimony", "Eminent Domain", "Police Power"], a: 0 }; }
        else if (qNum === 6) { return { q: "The Constitution is known as the supreme law of the...?", options: ["Government", "Land", "People", "Courts"], a: 1 }; }
        else if (qNum === 7) { return { q: "Fundamental powers are distributed among branches for whose benefit?", options: ["The President", "The Congress", "The people", "The Judges"], a: 2 }; }
        else if (qNum === 8) { return { q: "The Philippine Constitution is defined as what kind of instrument?", options: ["Unwritten instrument", "Temporary instrument", "Divine instrument", "Written instrument"], a: 3 }; }
        else if (qNum === 9) { return { q: "Which Article of the 1987 Constitution covers the National Territory?", options: ["Article I", "Article II", "Article III", "Article IV"], a: 0 }; }
        else if (qNum === 10) { return { q: "Which Article contains the Bill of Rights?", options: ["Article I", "Article III", "Article V", "Article VII"], a: 1 }; }
        else if (qNum === 11) { return { q: "Which Article governs the Legislative Department?", options: ["Article VII", "Article VIII", "Article VI", "Article IX"], a: 2 }; }
        else if (qNum === 12) { return { q: "Which Article governs the Executive Department?", options: ["Article VI", "Article VIII", "Article X", "Article VII"], a: 3 }; }
        else if (qNum === 13) { return { q: "Which Article governs the Judicial Department?", options: ["Article VIII", "Article VI", "Article VII", "Article IX"], a: 0 }; }
        else if (qNum === 14) { return { q: "What principle distributes powers among several departments or branches?", options: ["Checks and balances", "Separation of powers", "Eminent Domain", "Due Process"], a: 1 }; }
        else if (qNum === 15) { return { q: "How many branches of government are established?", options: ["2", "4", "3", "5"], a: 2 }; }
        else if (qNum === 16) { return { q: "What system allows a department to limit, monitor, or block actions by other branches?", options: ["Separation of powers", "Bill of Attainder", "Judicial Review", "Checks and balances"], a: 3 }; }
        else if (qNum === 17) { return { q: "The Latin word 'preambulare' means to walk...?", options: ["Before", "After", "Together", "Forward"], a: 0 }; }
        else if (qNum === 18) { return { q: "What is defined as an introduction, a preliminary or preparatory statement?", options: ["Constitution", "Preamble", "Article", "Amendment"], a: 1 }; }
        else if (qNum === 19) { return { q: "Who implores the aid of Almighty God in the Preamble?", options: ["The President", "The Congress", "The sovereign Filipino people", "The Supreme Court"], a: 2 }; }
        else if (qNum === 20) { return { q: "One national purpose in adopting the Constitution is to build a just and humane...?", options: ["Government", "Nation", "Economy", "Society"], a: 3 }; }
        else if (qNum === 21) { return { q: "What refers to the country's heritage and resources passed from one generation to another?", options: ["Patrimony", "Posterity", "Sovereignty", "Territory"], a: 0 }; }
        else if (qNum === 22) { return { q: "What term in the Preamble refers to future generations?", options: ["Patrimony", "Posterity", "Ancestry", "Citizens"], a: 1 }; }
        else if (qNum === 23) { return { q: "What is the declaration and enumeration of a person's rights and privileges designed to protect against government violations?", options: ["Statutory Rights", "Preamble", "Bill of Rights", "Writ of Habeas Corpus"], a: 2 }; }
        else if (qNum === 24) { return { q: "What rights are possessed by every citizen because they are given to man by God?", options: ["Constitutional Rights", "Statutory Rights", "Human Rights", "Natural Rights"], a: 3 }; }
        else if (qNum === 25) { return { q: "Which of the following is a key characteristic of Natural Rights?", options: ["Inalienable", "Revocable", "Temporary", "Granted by law"], a: 0 }; }
        else if (qNum === 26) { return { q: "What rights are conferred and protected by the Constitution?", options: ["Statutory Rights", "Constitutional Rights", "Natural Rights", "Divine Rights"], a: 1 }; }
        else if (qNum === 27) { return { q: "What rights are provided by laws promulgated by the law-making body?", options: ["Constitutional Rights", "Natural Rights", "Statutory Rights", "Inherent Rights"], a: 2 }; }
        else if (qNum === 28) { return { q: "What does an 'In flagrante delicto' arrest mean?", options: ["After the fact", "Beyond reasonable doubt", "Ignorance of the law", "Caught in the act"], a: 3 }; }
        else if (qNum === 29) { return { q: "What warrantless arrest applies when an officer has personal knowledge of facts that the person committed an offense?", options: ["Hot pursuit arrest", "Escapee arrest", "In flagrante delicto", "Citizen's arrest"], a: 0 }; }
        else if (qNum === 30) { return { q: "What warrantless arrest applies to someone who fled from a detention facility?", options: ["Hot pursuit arrest", "Escapee arrest", "Plain view doctrine", "Exigent arrest"], a: 1 }; }
        else if (qNum === 31) { return { q: "What doctrine allows seizing evidence of a crime seen in plain sight without a warrant?", options: ["Stop-and-frisk", "Moving vehicle rule", "Plain view doctrine", "Consent search"], a: 2 }; }
        else if (qNum === 32) { return { q: "Voluntarily agreeing to a search without a warrant is called a...?", options: ["Emergency search", "Stop-and-frisk", "Customs search", "Consent searches"], a: 3 }; }
        else if (qNum === 33) { return { q: "Observing unusual conduct that suggests a person may be armed and frisking them is called...?", options: ["Stop-and-frisk", "Hot pursuit", "Plain view", "Exigent circumstance"], a: 0 }; }
        else if (qNum === 34) { return { q: "The moving vehicle rule is an example of what search circumstance?", options: ["Stop-and-frisk", "Exigent and emergency", "Customs search", "Consent search"], a: 1 }; }
        else if (qNum === 35) { return { q: "Whose signature must officially appear in a warrant of arrest?", options: ["The police officer", "The prosecutor", "The judge", "The Mayor"], a: 2 }; }
        else if (qNum === 36) { return { q: "What refers to the factual basis that a crime was committed based on the judge's personal evaluation?", options: ["Due process", "Just compensation", "Beyond reasonable doubt", "Probable cause"], a: 3 }; }
        else if (qNum === 37) { return { q: "A search warrant must clearly describe the exact house or premises, which is known as the particular...?", options: ["Place", "Items", "Offense", "Person"], a: 0 }; }
        else if (qNum === 38) { return { q: "The power to take private property for public use upon paying just compensation is known as...?", options: ["Property Rights", "Eminent Domain", "Taxation", "Seizure"], a: 1 }; }
        else if (qNum === 39) { return { q: "An order commanding that a detained person be brought before a court is a Writ of Habeas...?", options: ["Mandamus", "Amparo", "Corpus", "Data"], a: 2 }; }
        else if (qNum === 40) { return { q: "Under Section 19, any death penalty already imposed shall be reduced to...?", options: ["Life imprisonment", "Prision mayor", "Reclusion temporal", "Reclusion perpetua"], a: 3 }; }
        else if (qNum === 41) { return { q: "What is the imprisonment duration for Reclusion Perpetua?", options: ["20-40 years", "10-20 years", "Life without parole", "1-5 years"], a: 0 }; }
        else if (qNum === 42) { return { q: "A fixed tax charged to every individual regardless of income is a...?", options: ["Income tax", "Poll tax", "Value-added tax", "Property tax"], a: 1 }; }
        else if (qNum === 43) { return { q: "What is an example of a poll tax (capitation or head tax)?", options: ["VAT", "Tariff", "Cedula", "TIN"], a: 2 }; }
        else if (qNum === 44) { return { q: "A law making an act criminal even if it was not a crime when committed is called Ex Post...?", options: ["Attainder", "Corpus", "Delicto", "Facto"], a: 3 }; }
        else if (qNum === 45) { return { q: "A legislative act that directly declares a person guilty of a crime without trial is a Bill of...?", options: ["Attainder", "Rights", "Lading", "Particulars"], a: 0 }; }
        return null;
    }

    let quizContainer = document.getElementById('quiz-container');

    for (let i = 1; i <= 45; i++) {
        let qData = getQuestionData(i);
        if (qData) {
            let optionsHTML = "";
            for(let j = 0; j < qData.options.length; j++) {
                optionsHTML += `
                    <li>
                        <label>
                            <input type="radio" name="q${i}" value="${j}">
                            ${qData.options[j]}
                            <span id="reveal-q${i}-opt${j}" class="feedback"></span>
                        </label>
                    </li>
                `;
            }

            let qHTML = `
                <div class="question-box">
                    <div class="question">${i}. ${qData.q} <span id="mark${i}" class="feedback"></span></div>
                    <ul class="options">
                        ${optionsHTML}
                    </ul>
                    <input type="hidden" id="a${i}" value="${qData.a}">
                </div>
            `;
            quizContainer.innerHTML += qHTML;
        }
    }

    function submitQuiz() {
        let score = 0;
        for (let i = 1; i <= 45; i++) {
            let selectedOption = document.querySelector(`input[name="q${i}"]:checked`);
            let correctAnswerIndex = document.getElementById('a' + i).value;
            let mark = document.getElementById('mark' + i);
            
            mark.innerText = "";

            if (selectedOption) {
                if (selectedOption.value === correctAnswerIndex) {
                    score++;
                    mark.innerText = "✓";
                } else {
                    mark.innerText = "x";
                }
            } else {
                mark.innerText = "x";
            }
        }
        
        document.getElementById('result').innerText = `Score: ${score} / 45`;
        document.getElementById('reveal-btn').style.display = 'inline-block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function revealAnswers() {
        for (let i = 1; i <= 45; i++) {
            let correctAnswerIndex = document.getElementById('a' + i).value;
            let revealSpan = document.getElementById('reveal-q' + i + '-opt' + correctAnswerIndex);
            revealSpan.innerText = "✓";
        }
    }
</script>

</body>
</html>
